name: Build and Deploy Documentation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install documentation dependencies
        run: |
          if [ -f docs/_sphinx/requirements.txt ]; then
            pip install -r docs/_sphinx/requirements.txt
          fi
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Build Sphinx documentation
        run: |
          cd docs/_sphinx
          make html

      - name: Copy Sphinx docs to api directory  
        run: |
          # Copy Sphinx output to docs/api/ for Jekyll and public access  
          rm -rf docs/api
          mkdir -p docs/api
          cp -r docs/_sphinx/_build/html/* docs/api/
          
          # Debug: Check what files were copied
          echo "=== Sphinx files copied to docs/api ==="
          ls -la docs/api/
          echo "=== Static files ==="
          find docs/api -name "*.css" -o -name "*.js" | head -10
          echo "=== HTML files ==="  
          find docs/api -name "*.html" | head -10

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./docs/_site

      - name: Copy Sphinx assets to final site (preserve original structure)
        run: |
          # Remove Jekyll-processed api directory and replace with original Sphinx
          rm -rf docs/_site/api
          cp -r docs/_sphinx/_build/html docs/_site/api
          
          # Debug: Check final structure
          echo "=== Final site structure ==="
          ls -la docs/_site/api/
          echo "=== Final CSS files ==="
          find docs/_site/api -name "*.css" | head -5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload Jekyll-built site with preserved Sphinx
          path: ./docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4