name: Build and Deploy Documentation

on:
  push:
    tags: [ 'v*' ]  # Only build docs on version tags (v1.0.0, v0.2.1, etc.)
  workflow_dispatch:  # Allow manual triggering from GitHub UI

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        # Install documentation specific requirements first
        if [ -f docs/requirements.txt ]; then pip install -r docs/requirements.txt; fi
        # Install project requirements if they exist
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Setup Sphinx (if not already done)
      run: |
        if [ ! -f docs/conf.py ]; then
          mkdir -p docs
          cd docs
          sphinx-quickstart . --no-sep -p "Your Project Name" -a "Your Name" -v "1.0" --ext-autodoc --makefile --no-batchfile -q
        fi
    
    - name: Build documentation
      run: |
        cd docs
        make html
        # Copy .nojekyll to build directory to prevent Jekyll processing
        cp .nojekyll _build/html/
    
    - name: Setup Pages
      uses: actions/configure-pages@v5
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs/_build/html
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4