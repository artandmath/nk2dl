name: Build and Deploy Documentation

on:
  push:
    tags: [ 'v*' ]  # Only build docs on version tags (v1.0.0, v0.2.1, etc.)
  workflow_dispatch:  # Allow manual triggering from GitHub UI

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        # Install documentation specific requirements first
        if [ -f docs/requirements.txt ]; then pip install -r docs/requirements.txt; fi
        # Install project requirements if they exist
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Setup Sphinx (if not already done)
      run: |
        if [ ! -f docs/conf.py ]; then
          mkdir -p docs
          cd docs
          sphinx-quickstart . --no-sep -p "Your Project Name" -a "Your Name" -v "1.0" --ext-autodoc --makefile --no-batchfile -q
        fi
    
    - name: Build Sphinx documentation
      run: |
        cd docs
        make html
        # Copy .nojekyll to build directory
        cp .nojekyll _build/html/
        
    - name: Create hybrid documentation structure
      run: |
        cd docs
        
        # Create final site structure
        mkdir -p _build/final_site
        
        # First, set up Jekyll for the main site
        echo "Setting up Jekyll structure..."
        cp *.md _build/final_site/ 2>/dev/null || echo "No markdown files to copy"
        cp _config.yaml _build/final_site/ 2>/dev/null || echo "No Jekyll config to copy"
        
        # Copy assets
        if [ -d "assets" ]; then
          cp -r assets _build/final_site/
        fi
        if [ -d "img" ]; then
          cp -r img _build/final_site/
        fi
        
        # Copy Sphinx docs to /api subdirectory
        echo "Moving Sphinx docs to /api..."
        cp -r _build/html _build/final_site/api
        
        # Copy .nojekyll to root to prevent Jekyll processing of Sphinx content
        cp .nojekyll _build/final_site/
    
    - name: Setup Pages
      uses: actions/configure-pages@v5
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs/_build/final_site
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4