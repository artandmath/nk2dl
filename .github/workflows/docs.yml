name: Build and Deploy Documentation

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        # Install documentation specific requirements first
        if [ -f docs/requirements.txt ]; then pip install -r docs/requirements.txt; fi
        # Install project requirements if they exist
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Setup Sphinx (if not already done)
      run: |
        if [ ! -f docs/conf.py ]; then
          mkdir -p docs
          cd docs
          sphinx-quickstart . --no-sep -p "Your Project Name" -a "Your Name" -v "1.0" --ext-autodoc --makefile --no-batchfile -q
        fi
    
    - name: Build documentation
      run: |
        cd docs
        make html
        # Copy .nojekyll to build directory to prevent Jekyll processing
        cp .nojekyll _build/html/
        # Copy built docs to docs/_site/ folder (standard practice)
        rm -rf _site
        cp -r _build/html _site
    
    - name: Commit built documentation
      if: github.ref == 'refs/heads/development'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/_site/
        git diff --staged --quiet || git commit -m "docs: update built documentation [skip ci]"
        git push